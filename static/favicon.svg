<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 256 256"
	role="img"
	aria-labelledby="title desc"
>
	<title id="title">Steven Gerner</title>
	<desc id="desc">Transparent SG monogram in lime, coral, and blue</desc>
	<defs>
		<linearGradient id="s-gradient" x1="0" y1="0" x2="0" y2="1">
			<stop stop-color="#e1ff69" />
			<stop offset="1" stop-color="#a9c8ff" />
		</linearGradient>
		<linearGradient id="g-gradient" x1="0" y1="0" x2="1" y2="1">
			<stop stop-color="#ffb0bd" />
			<stop offset="1" stop-color="#a9c8ff" />
		</linearGradient>
	</defs>
	<text
		x="12"
		y="183"
		font-family="Inter, Helvetica Neue, Arial, sans-serif"
		font-size="166"
		font-weight="800"
		fill="url(#s-gradient)"
	>
		S
	</text>
	<text
		x="112"
		y="183"
		font-family="Inter, Helvetica Neue, Arial, sans-serif"
		font-size="166"
		font-weight="800"
		fill="url(#g-gradient)"
	>
		G
	</text>
</svg>
